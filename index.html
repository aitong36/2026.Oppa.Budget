  :root{
    --cream:#FBF3E7;
    --cream-deep:#F3E4CC;
    --fur:#E3A75C;
    --fur-deep:#C97B3B;
    --belly:#FFFDF8;
    --ink:#28394D;
    --ink-soft:#4C5F76;
    --text:#4A3A28;
    --text-soft:#8A7860;
    --line:#E9D6B6;
    --danger:#C15B4A;
    --good:#5C8A5C;
    --shadow: 0 8px 24px -12px rgba(74,58,40,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'GenSen Rounded',-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(227,167,92,0.16), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(40,57,77,0.10), transparent 45%),
      var(--cream);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }

  .wrap{max-width:480px;margin:0 auto;padding:20px 18px 8px;}

  /* Header */
  header{display:flex;align-items:center;gap:12px;padding:6px 2px 18px;}
  .mark{
    width:60px;height:auto;flex:none;
    filter:
      drop-shadow(0 2px 0 rgba(74,58,40,0.10))
      drop-shadow(0 6px 10px rgba(74,58,40,0.22));
  }
  header h1{
    font-size:22px;margin:0;line-height:1.1;color:var(--ink);
    font-weight:700; letter-spacing:0.2px;
  }
  header p{margin:2px 0 0;font-size:12.5px;color:var(--text-soft);}

  /* Card */
  .card{
    background:var(--belly);
    border:1px solid var(--line);
    border-radius:22px;
    padding:18px 18px 20px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }

  label.field-label{
    display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);
    margin:0 0 6px 2px;
  }

  .row{margin-bottom:16px;}

  input[type="date"], input[type="text"], input[type="number"]{
    width:100%;
    font-size:16px;
    font-family:inherit;
    padding:12px 14px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:var(--cream);
    color:var(--text);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus{border-color:var(--fur-deep); background:var(--belly);}

  .amount-row{display:flex;align-items:center;gap:8px;}
  .amount-row span{
    font-weight:700; font-size:18px; color:var(--fur-deep);
  }
  #currency{
    flex:none;
    width:92px;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    color:var(--fur-deep);
    padding:12px 8px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:var(--cream);
    outline:none;
  }
  #currency:focus{border-color:var(--fur-deep); background:var(--belly);}

  /* category grid */
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .cat-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:10px 4px 9px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:var(--cream);
    color:var(--text-soft);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    user-select:none;
    text-align:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease, border-color .15s ease, background .15s ease, color .15s ease;
  }
  .cat-btn .emo{font-size:20px;line-height:1;}
  .cat-btn .zh{line-height:1.2;}
  .cat-btn .tl{font-size:9.5px;font-weight:500;opacity:0.75;line-height:1.2;}
  .cat-btn.active{
    border-color:var(--ink);
    background:var(--ink);
    color:var(--belly);
    transform:translateY(-1px);
  }
  .cat-btn:active{transform:scale(0.96);}

  /* submit button */
  .paw-btn{
    width:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:14px 18px;
    border:none;border-radius:18px;
    background:linear-gradient(180deg, var(--fur), var(--fur-deep));
    color:#fff;
    font-family:inherit;
    font-size:17px;font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 20px -8px rgba(201,123,59,0.55);
    transition:transform .1s ease, opacity .15s ease;
  }
  .paw-btn .tl{font-size:11px;font-weight:500;opacity:0.85;}
  .paw-btn-row{display:flex;align-items:center;justify-content:center;gap:9px;}
  .paw-btn:active{transform:scale(0.98);}
  .paw-btn:disabled{opacity:0.55;cursor:default;}
  .paw-btn svg{width:20px;height:20px;flex:none;}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);
    background:var(--ink);color:var(--belly);
    padding:12px 20px;border-radius:14px;
    font-size:14px;font-weight:600;
    display:flex;align-items:center;gap:8px;
    box-shadow:0 12px 28px -10px rgba(0,0,0,0.4);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
    max-width:88%;
    text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
  #toast.err{background:var(--danger);}

  /* month total */
  .total-card{
    text-align:center;
    padding:26px 18px 24px;
  }
  .total-card .label{font-size:13.5px;color:var(--text-soft);font-weight:600;}
  .total-card .month{font-size:12px;color:var(--text-soft);opacity:0.8;margin-top:2px;}
  .total-card .amount{
    font-size:40px;font-weight:700;color:var(--fur-deep);
    margin:8px 0 2px;
  }
  .total-card .amount.sub{
    font-size:20px;margin:0 0 2px;
  }
  .total-card .paw-deco{font-size:20px;opacity:0.5;}

  .setup-note{
    font-size:11.5px;color:var(--text-soft);text-align:center;padding:10px 20px 0;line-height:1.6;
  }
  .setup-note code{background:var(--cream-deep);padding:1px 5px;border-radius:6px;}
</style>
</head>
<body>

    <div>
      <h1>歐巴記帳</h1>
      <p>Kì-siàu kì hó--ah--buē? 🐾</p>
    </div>
  </header>

  <form class="card" id="entryForm">
    <div class="row">
      <label class="field-label" for="date">日期 li̍t-kî</label>
      <input type="date" id="date" required>
    </div>

    <div class="row">
      <label class="field-label" for="item">項目 hāng-bo̍k</label>
      <input type="text" id="item" placeholder="例如：滷肉飯、捷運悠遊卡" required>
    </div>

    <div class="row">
      <label class="field-label" for="amount">金額 tsînn-gia̍h</label>
      <div class="amount-row">
        <select id="currency">
          <option value="NTD">NTD</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="JPY">JPY</option>
          <option value="KRW">KRW</option>
        </select>
        <input type="number" id="amount" inputmode="numeric" min="0" step="1" placeholder="0" required>
      </div>
    </div>

    <div class="row" style="margin-bottom:18px;">
      <label class="field-label">類別 luī-pia̍t</label>
      <div class="cat-grid" id="catGrid">
        <div class="cat-btn" data-cat="外食"><span class="emo">🍜</span><span class="zh">外食</span><span class="tl">tsia̍h-guā-kháu</span></div>
        <div class="cat-btn" data-cat="自煮食材"><span class="emo">🥬</span><span class="zh">自煮食材</span><span class="tl">ka-kī tsú-tsia̍h</span></div>
        <div class="cat-btn" data-cat="交通"><span class="emo">🚌</span><span class="zh">交通</span><span class="tl">kau-thong</span></div>
        <div class="cat-btn" data-cat="美妝"><span class="emo">💄</span><span class="zh">美妝</span><span class="tl">uē-tsng</span></div>
        <div class="cat-btn" data-cat="衣"><span class="emo">👗</span><span class="zh">衣</span><span class="tl">sann-á-khòo</span></div>
        <div class="cat-btn" data-cat="住"><span class="emo">🏠</span><span class="zh">住</span><span class="tl">ka-iōng</span></div>
        <div class="cat-btn" data-cat="娛樂"><span class="emo">🎮</span><span class="zh">娛樂</span><span class="tl">ngôo-lo̍k</span></div>
        <div class="cat-btn" data-cat="旅遊"><span class="emo">✈️</span><span class="zh">旅遊</span><span class="tl">lú-hîng</span></div>
        <div class="cat-btn" data-cat="醫療"><span class="emo">🏥</span><span class="zh">醫療</span><span class="tl">i-liâu</span></div>
        <div class="cat-btn" data-cat="歐巴相關"><span class="emo">🐶</span><span class="zh">歐巴相關</span><span class="tl">Oppa</span></div>
        <div class="cat-btn" data-cat="紅包禮金"><span class="emo">🧧</span><span class="zh">紅包禮金</span><span class="tl">âng-pau/lé-kim</span></div>
        <div class="cat-btn" data-cat="其他"><span class="emo">🐾</span><span class="zh">其他</span><span class="tl">kî-thann</span></div>
      </div>
    </div>

    <button type="submit" class="paw-btn" id="submitBtn">
      <div class="paw-btn-row">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 9.5c1 0 2-1.1 2-2.7S9.5 4 8.5 4 6.5 5.2 6.5 6.8s1 2.7 2 2.7zm7 0c1 0 2-1.1 2-2.7S16.5 4 15.5 4s-2 1.2-2 2.8 1 2.7 2 2.7zM4.5 13.5c.9 0 1.6-.9 1.6-2.2S5.4 9 4.5 9s-1.6 1-1.6 2.3.7 2.2 1.6 2.2zm15 0c.9 0 1.6-.9 1.6-2.2S20.4 9 19.5 9s-1.6 1-1.6 2.3.7 2.2 1.6 2.2zM12 12.2c-2.6 0-6 2-6 4.6 0 1.3 1 2.2 2.3 2.2.9 0 1.6-.4 2.2-.6.5-.2 1-.4 1.5-.4s1 .2 1.5.4c.6.2 1.3.6 2.2.6 1.3 0 2.3-.9 2.3-2.2 0-2.6-3.4-4.6-6-4.6z"/></svg>
        <span id="submitLabel">確認送出</span>
      </div>
      <span class="tl">kì-siàu kì hó--ā</span>
    </button>
  </form>

  <div class="card total-card" id="totalCard">
    <div class="label">本月累計</div>
    <div class="month" id="monthLabel"></div>
    <div id="monthTotals">
      <div class="amount">NT$0</div>
    </div>
    <div class="paw-deco">🐾 🐾 🐾</div>
  </div>

  <p class="setup-note">第一次使用嗎？打開 <code>index.html</code> 找到 <code>SCRIPT_URL</code>，換成你自己的 Google Apps Script 網址。</p>

</div>

<div id="toast"></div>

<script>
/* ====== 設定：把這裡換成你自己部署的 Google Apps Script 網址 ====== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGQBmOnH0ySVJd0g-D8gEg_qZMR52x_x9SiWhk3IHfMSD9i9dcqDKGv_5rXpc2txF9/exec";
/* ================================================================ */

const form = document.getElementById('entryForm');
const dateInput = document.getElementById('date');
const itemInput = document.getElementById('item');
const amountInput = document.getElementById('amount');
const currencySelect = document.getElementById('currency');
const catGrid = document.getElementById('catGrid');
const submitBtn = document.getElementById('submitBtn');
const submitLabel = document.getElementById('submitLabel');
const monthTotalsEl = document.getElementById('monthTotals');
const monthLabelEl = document.getElementById('monthLabel');
const toast = document.getElementById('toast');

const currencySymbols = { NTD:'NT$', USD:'US$', EUR:'€', JPY:'¥', KRW:'₩' };

let selectedCat = null;

// default date = today
const today = new Date();
dateInput.value = today.toISOString().slice(0,10);
monthLabelEl.textContent = today.getFullYear() + ' 年 ' + (today.getMonth()+1) + ' 月';

catGrid.addEventListener('click', (e) => {
  const btn = e.target.closest('.cat-btn');
  if(!btn) return;
  [...catGrid.children].forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  selectedCat = btn.dataset.cat;
});

function showToast(msg, isErr){
  toast.textContent = msg;
  toast.classList.toggle('err', !!isErr);
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
}

function fmt(n, currency){
  const sym = currencySymbols[currency] || (currency + ' ');
  return sym + Number(n||0).toLocaleString('zh-Hant-TW');
}

function currentMonthKey(){
  const now = new Date();
  const m = (now.getMonth()+1).toString().padStart(2,'0');
  return now.getFullYear() + '-' + m;
}

async function loadMonthTotal(){
  if(SCRIPT_URL.includes('PASTE_YOUR')){
    monthTotalsEl.innerHTML = '<div class="amount">NT$0</div>';
    return;
  }
  try{
    const res = await fetch(SCRIPT_URL + '?month=' + currentMonthKey(), { method:'GET' });
    const data = await res.json();
    const totals = data.totals || {};
    const entries = Object.entries(totals).filter(([_, v]) => v);
    if(entries.length === 0){
      monthTotalsEl.innerHTML = '<div class="amount">NT$0</div>';
    }else{
      monthTotalsEl.innerHTML = entries.map(([cur, val], i) =>
        `<div class="amount${i === 0 ? '' : ' sub'}">${fmt(val, cur)}</div>`
      ).join('');
    }
  }catch(err){
    monthTotalsEl.innerHTML = '<div class="amount">--</div>';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  if(!selectedCat){
    showToast('請選一個類別喔 🐾', true);
    return;
  }
  if(SCRIPT_URL.includes('PASTE_YOUR')){
    showToast('請先設定 Google Sheets 連結', true);
    return;
  }

  const payload = {
    date: dateInput.value,
    item: itemInput.value.trim(),
    amount: Number(amountInput.value),
    currency: currencySelect.value,
    category: selectedCat
  };

  submitBtn.disabled = true;
  submitLabel.textContent = '記錄中…';

  try{
    await fetch(SCRIPT_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    showToast('記好了！汪 🐕');
    itemInput.value = '';
    amountInput.value = '';
    currencySelect.value = 'NTD';
    [...catGrid.children].forEach(c => c.classList.remove('active'));
    selectedCat = null;
    loadMonthTotal();
  }catch(err){
    showToast('送出失敗，請檢查網路', true);
  }finally{
    submitBtn.disabled = false;
    submitLabel.textContent = '確認送出';
  }
});

loadMonthTotal();
</script>
</body>
</html>
